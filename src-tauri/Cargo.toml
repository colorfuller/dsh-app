[package]
name = "dsh-app"
version = "0.1.2"
description = "One-click desktop launcher for the DeepSeek Harness Web UI"
edition = "2021"

[lib]
name = "dsh_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
url = "2"
