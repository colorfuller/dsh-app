name: Build multi-platform installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            bundles: nsis
          - os: macos-latest
            platform: macos-arm64
            bundles: dmg
          - os: macos-15-intel
            platform: macos-x64
            bundles: dmg
          - os: ubuntu-22.04
            platform: linux-x64
            bundles: deb,appimage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf \
            libfuse2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate icons
        run: pnpm icons

      - name: Build installers (${{ matrix.bundles }})
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        run: pnpm build --bundles ${{ matrix.bundles }} --verbose

      - name: Smoke test runtime auto-update
        run: pnpm smoke:update

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p installers
          find "src-tauri/target/release/bundle" -maxdepth 3 -type f \
            \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" \
               -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) \
            -exec cp -f {} installers/ \;

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: installers/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          generate_release_notes: true
